<div class="login-page">
  <p-card header="Iniciar sesión" styleClass="login-card">
    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="field">
        <label for="username">Usuario</label>
        <input pInputText id="username" type="text" formControlName="username" />
        <small class="p-error" *ngIf="form.controls.username.touched && form.controls.username.invalid">
          El usuario es obligatorio (mínimo 3 caracteres).
        </small>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input pInputText id="password" type="password" formControlName="password" />
        <small class="p-error" *ngIf="form.controls.password.touched && form.controls.password.invalid">
          La contraseña es obligatoria (mínimo 6 caracteres).
        </small>
      </div>

      <button pButton type="submit" label="Entrar" icon="pi pi-sign-in" [loading]="loading" [disabled]="loading"></button>
    </form>
  </p-card>
</div>
